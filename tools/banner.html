<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Banner do README — Pokémon Bullet Heaven</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  /*
   * O banner do README (assets/banner.png), montado com o que o jogo já tem: a
   * arte do título (a do Fellipe) e o logo em pixel, com o CSS da tela de título.
   * A página ocupa a janela inteira; quem decide o recorte é o --size:
   *   npm run screens -- banner --size 1280x480 --out assets
   * Parado (sem a respiração da arte e a flutuação do logo), para a foto sair igual.
   */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #060816; }
  .banner { position: fixed; inset: 0; isolation: isolate; display: flex; align-items: center; justify-content: center; }
  /* do topo da arte: a lua e o Charizard inteiros, sem as pontas das orelhas do Pikachu e do Eevee embaixo */
  .banner .title-bg { animation: none; object-position: center top; }
  .banner .title-content { animation: none; margin-top: 0; gap: 22px; }
  .banner .logo-block { animation: none; }
  .banner .logo-main { font-size: 76px; }
  .banner .logo-sub span { font-size: 22px; }
  .banner .tagline { display: block; font-size: 19px; }
  /* o véu do título, um pouco mais firme no meio: no README o banner aparece pequeno */
  .banner .title-scrim {
    background:
      radial-gradient(ellipse 46% 62% at 50% 50%, rgba(6, 8, 22, .62), transparent 80%),
      linear-gradient(180deg, rgba(6, 8, 22, .35) 0%, transparent 25%, transparent 72%, rgba(6, 8, 22, .6) 100%);
  }
</style>
</head>
<body>
  <div class="banner">
    <img class="title-bg" src="../assets/ui/title-background.webp" alt="" />
    <div class="title-scrim"></div>
    <div class="title-content">
      <div class="logo-block">
        <h1 class="logo-main">POKÉMON</h1>
        <div class="logo-sub"><span>BULLET HEAVEN</span></div>
      </div>
      <p class="tagline">Monte sua equipe. Enfrente a horda. Conquiste Kanto.</p>
    </div>
  </div>
</body>
</html>

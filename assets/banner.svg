<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Pokémon Bullet Heaven">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#223066"/>
      <stop offset="60%" stop-color="#0e1530"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ee1515"/>
      <stop offset="100%" stop-color="#a81414"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="720" height="260" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="720" height="260" fill="url(#sky)"/>

    <!-- Poké Ball decorativa -->
    <g transform="translate(596 130)" opacity="0.5">
      <circle r="122" fill="#0b1226"/>
      <path d="M -122 0 A 122 122 0 0 1 122 0 Z" fill="#ee1515" opacity="0.65"/>
      <path d="M -122 0 A 122 122 0 0 0 122 0 Z" fill="#f6f8ff" opacity="0.35"/>
      <rect x="-122" y="-11" width="244" height="22" fill="#0b1226"/>
      <circle r="34" fill="#0b1226"/>
      <circle r="24" fill="#f6f8ff" opacity="0.5"/>
      <circle r="122" fill="none" stroke="#0b1226" stroke-width="10"/>
    </g>

    <!-- orbes de XP -->
    <circle cx="70" cy="214" r="5" fill="#59c1ff" opacity="0.8"/>
    <circle cx="104" cy="228" r="4" fill="#59c1ff" opacity="0.55"/>
    <circle cx="140" cy="206" r="3" fill="#59c1ff" opacity="0.45"/>

    <!-- título -->
    <text x="52" y="108" font-family="Verdana, DejaVu Sans, sans-serif" font-size="64" font-weight="bold"
          fill="#ffcb05" stroke="#3b4cca" stroke-width="6" paint-order="stroke" letter-spacing="3">POKÉMON</text>

    <rect x="52" y="132" width="392" height="46" rx="23" fill="url(#ribbon)" stroke="#f6f8ff" stroke-width="4"/>
    <text x="248" y="163" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif" font-size="25"
          font-weight="bold" fill="#f6f8ff" letter-spacing="6">BULLET HEAVEN</text>

    <text x="52" y="208" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" fill="#93a3cf">
      Monte sua equipe. Enfrente a horda. Conquiste Kanto.
    </text>

    <rect x="0" y="0" width="720" height="260" rx="18" fill="none" stroke="#2d3c78" stroke-width="3"/>
  </g>
</svg>
